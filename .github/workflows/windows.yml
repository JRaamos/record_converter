name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Validate and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install browser for interface tests
        run: npx playwright install chromium
      - name: Interface tests
        run: npm run test:e2e
      - name: Electron integration tests
        run: npm run test:electron
      - name: Build unsigned installer and portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged files and executable integrity
        run: npm run test:packaged
      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Record-Converter-Windows-x64
          path: |
            release/Record-Converter-Setup-*.exe
            release/Record-Converter-Portable-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish stable GitHub Release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Only stable vX.Y.Z tags can publish.'; exit 1; }
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/download-artifact@v4
        with:
          name: Record-Converter-Windows-x64
          path: release
      - name: Publish release with executables and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/Record-Converter-Setup-*.exe \
            release/Record-Converter-Portable-*.exe \
            release/SHA256SUMS.txt \
            --verify-tag --title "Record Converter $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md
